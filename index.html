<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <title>夕阳红关爱平台</title>
    <style>
        /* 基础样式 */
        :root {
            --main-color: #c0a27e;    /* 适老化推荐色 */
            --text-color: #2a2a2a;
            --bg-color: #f8f8f8;
        }

        body {
            font-family: 'Microsoft YaHei', sans-serif;
            line-height: 1.8;
            color: var(--text-color);
            background: var(--bg-color);
            margin: 0;
            padding: 20px;
            max-width: 800px;
            margin: 0 auto;
        }

        /* 标题样式 */
        h1 {
            font-size: 36px;
            color: var(--main-color);
            text-align: center;
            margin-bottom: 30px;
            font-weight: 600;
        }

        /* 按钮样式 */
        .btn {
            display: inline-block;
            padding: 15px 30px;
            font-size: 24px;
            color: #fff;
            background: var(--main-color);
            border-radius: 10px;
            text-decoration: none;
            margin: 15px 0;
            transition: transform 0.3s;
        }

        .btn:hover {
            transform: scale(1.05);
        }

        /* 卡片样式 */
        .card {
            background: #fff;
            border-radius: 15px;
            padding: 25px;
            margin: 20px 0;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        /* 表单元素 */
        input, select {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 20px;
        }

        /* 高对比度模式 */
        @media (prefers-contrast: high) {
            body {
                color: #000;
                background: #fff;
            }
            .main-color {
                --main-color: #666;
            }
        }
    </style>
</head>
<body>
    <!-- 头部导航 -->
    <nav aria-label="主导航">
        <ul style="list-style: none; padding: 0; text-align: center;">
            <li><a href="#home" class="btn">首页</a></li>
            <li><a href="#services" class="btn">服务项目</a></li>
            <li><a href="#about" class="btn">关于我们</a></li>
            <li><a href="#contact" class="btn">联系我们</a></li>
        </ul>
    </nav>

    <!-- 主内容区 -->
    <main>
        <section id="home" class="card">
            <h2>🌻 欢迎来到夕阳红关爱平台</h2>
            <p>我们致力于为老年人提供便捷、安全、有温度的数字化服务...</p>
            <img src="elderly-care.jpg" alt="老年人关怀插图" style="width:100%; border-radius:10px;">
        </section>

        <section id="services" class="card">
            <h2>🛎️ 我们的服务</h2>
            <div style="display:flex; flex-wrap:wrap; gap:20px; justify-content:center;">
                <div style="text-align:center; width:300px;">
                    <img src="health-check.png" alt="健康检查" style="width:80px;">
                    <h3>健康监测</h3>
                    <p>定期上门体检服务</p>
                </div>
                <div style="text-align:center; width:300px;">
                    <img src="community-activity.png" alt="社区活动" style="width:80px;">
                    <h3>文娱活动</h3>
                    <p>老年大学课程预约</p>
                </div>
            </div>
        </section>

        <section id="about" class="card">
            <h2>❤️ 我们的承诺</h2>
            <ul style="text-align: left; padding-left:20px;">
                <li>🔹 100%人工客服服务</li>
                <li>🔹 24小时紧急响应</li>
                <li>🔹 个人信息严格保密</li>
            </ul>
        </section>
    </main>

    <!-- 页脚 -->
    <footer style="margin-top:40px; text-align:center; color:#666;">
        <p>服务热线：400-800-1234</p>
        <p>地址：北京市朝阳区养老服务中心</p>
        <p>© 2026 夕阳红关爱平台 版权所有</p>
    </footer>
</body>
</html>
